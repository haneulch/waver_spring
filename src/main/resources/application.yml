# 프록시(nginx 등) 뒤에서 X-Forwarded-* 헤더 기준으로 스킴/호스트를 인식한다
# (없으면 https 접속 시 Swagger가 API 주소를 http로 만들어 mixed content로 차단됨)
server:
  forward-headers-strategy: framework

spring:
  application:
    name: waver
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=5m
  datasource:
    url: jdbc:mysql://localhost:3306/bucket
    username: root
    password: 12345
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    resources:
      static-locations: classpath:/static/
  messages:
    encoding: UTF-8
    basename: messages
  cloud:
    gcp:
      project-id: "waver-478413"
      credentials:
        location: "file:/home/opc/google-api-key.json"
      pubsub:
        subscription-id: "play-rtdn-topic-sub"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    url: /v3/api-docs
    disable-swagger-default-url: true

waver:
  secret:
    name: USER_ID
    key: ${JWT_SECRET_KEY}
    access-token-validity: 300d
  file:
    upload:
      # 로컬 경로에 맞게 수정 필요
      path: upload
    images:
      path: /waver/image
    statics:
      path: http://localhost:8080/images
  service-key-path: /home/opc/waver-service-account.json

google:
  play:
    credentials-path: /home/opc/google-api-key.json
    package-name: "com.zinc.waver"

logging:
  level:
    root: info

