# 프록시(nginx 등) 뒤에서 X-Forwarded-* 헤더 기준으로 스킴/호스트를 인식한다
# (없으면 https 접속 시 Swagger가 API 주소를 http로 만들어 mixed content로 차단됨)
server:
  forward-headers-strategy: framework

spring:
  # 로컬/개발 환경에서는 프로젝트 루트의 .env 파일을 읽어 환경변수를 채운다.
  # 파일이 없으면(optional) 시스템 환경변수만 사용한다. 운영은 시스템 환경변수로 주입.
  config:
    import: optional:file:.env[.properties]
  application:
    name: waver
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=5m
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bucket}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    resources:
      static-locations: classpath:/static/
  messages:
    encoding: UTF-8
    basename: messages
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:}
      credentials:
        location: ${GCP_CREDENTIALS_LOCATION:}
      pubsub:
        subscription-id: ${PLAY_RTDN_SUBSCRIPTION_ID:play-rtdn-topic-sub}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    url: /v3/api-docs
    disable-swagger-default-url: true

waver:
  secret:
    name: USER_ID
    key: ${JWT_SECRET_KEY}
    access-token-validity: 300d
  file:
    upload:
      path: ${FILE_UPLOAD_PATH:upload}
    images:
      path: /waver/image
    statics:
      path: ${FILE_STATICS_PATH:http://localhost:8080/images}
  service-key-path: ${WAVER_SERVICE_KEY_PATH:}

google:
  play:
    credentials-path: ${GOOGLE_PLAY_CREDENTIALS_PATH:}
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.zinc.waver}

logging:
  level:
    root: info

