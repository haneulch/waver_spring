spring:
  sql:
    init:
      data-locations: classpath:init-data.sql
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    gcp:
      credentials:
        location: classpath:google-api-key.json

google:
  play:
    credentials-path: src/main/resources/google-api-key.json

waver:
  service-key-path: src/main/resources/waver-service-account.json
